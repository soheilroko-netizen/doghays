name: Tauri Build
on:
  push:
    branches: [main, v2, v4, v5, v6, v12, kiri, h2, h2-optimized-ci-test, final, ui-improvements, feature/netherlands-germany3-profiles, rebuild]
  pull_request:
    branches: [main, v2, v4, v5, v6, v12, kiri, h2, final, ui-improvements, feature/netherlands-germany3-profiles, rebuild]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Cargo Dependencies
        run: |
          cd src-tauri
          cargo fetch

      - name: Download sing-box
        shell: pwsh
        run: |
          # Pinned to 1.13.19 — must match the version the app runtime pins
          # (src-tauri/src/proxy.rs). Unpinned "latest" can pull 1.14+ whose
          # config schema changes silently break the bundled config check/build.
          $tag = "1.13.19"
          Write-Host "sing-box version: $tag"
          $zip = "sing-box-$tag-windows-amd64.zip"
          $asset = "https://github.com/SagerNet/sing-box/releases/download/v$tag/$zip"
          Write-Host "Downloading $asset"
          Invoke-WebRequest -Uri $asset -OutFile sb.zip
          New-Item -ItemType Directory -Force src-tauri/bin | Out-Null
          tar -xf sb.zip -C src-tauri/bin --strip-components=1 "sing-box-$tag-windows-amd64/sing-box.exe"
          Get-ChildItem src-tauri/bin/sing-box.exe | Select-Object Name, Length

      - name: Install npm dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --verbose

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: shado-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
